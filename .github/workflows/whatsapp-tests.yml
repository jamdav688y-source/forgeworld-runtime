name: whatsapp-tests

on:
  pull_request:
    paths:
      - "whatsapp/**"
      - "perception/**"
      - "governance/**"
      - "tests/governance/**"
      - ".github/workflows/whatsapp-tests.yml"
  push:
    branches:
      - main
    paths:
      - "whatsapp/**"
      - "perception/**"
      - "governance/**"
      - "tests/governance/**"

jobs:
  test:
    name: whatsapp module test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run whatsapp/tests (stdlib unittest, no external deps)
        run: python3 -m unittest discover -s whatsapp/tests -p "test_*.py" -v

      - name: Confirm no network calls are required (offline sanity check)
        run: |
          python3 -c "
          import socket
          # Block only outbound connection attempts (create_connection), not
          # the socket.socket class itself -- replacing the class breaks
          # ssl.py's SSLSocket subclassing at import time (TypeError on
          # class definition), which previously made this step fail for a
          # reason unrelated to any real network call. Verified locally
          # before landing this fix; see whatsapp/reports/whatsapp_failure_correction_ledger.md.
          def blocked(*a, **k):
              raise RuntimeError('network access attempted during test run: socket.create_connection blocked')
          socket.create_connection = blocked
          import unittest
          loader = unittest.TestLoader()
          suite = loader.discover('whatsapp/tests', pattern='test_*.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          import sys
          sys.exit(0 if result.wasSuccessful() else 1)
          "

      - name: Verify no real secrets committed under whatsapp/
        run: |
          if grep -rEn "(WHATSAPP_ACCESS_TOKEN|WHATSAPP_APP_SECRET|WHATSAPP_VERIFY_TOKEN)[\"']?\s*[:=]\s*[\"'][A-Za-z0-9_\-]{20,}" whatsapp/ --include="*.py" --include="*.json" --include="*.md" | grep -v "fixture\|not-real\|os.environ"; then
            echo "Possible hardcoded secret found -- failing the build."
            exit 1
          fi
          echo "No hardcoded secret patterns found."

  perception:
    name: perception + governance test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest (tests/governance requires it -- no __init__.py, uses conftest.py)
        run: python3 -m pip install "pytest>=7"

      - name: Run perception/tests
        run: python3 -m pytest perception/tests -v

      - name: Run tests/governance
        run: python3 -m pytest tests/governance -v

      - name: Run format/magic-byte detection regression tests explicitly
        run: python3 -m pytest perception/tests/test_format_detection.py -v

      - name: Confirm no network calls are required (offline sanity check)
        run: |
          python3 -c "
          import socket
          def blocked(*a, **k):
              raise RuntimeError('network access attempted during test run: socket.create_connection blocked')
          socket.create_connection = blocked
          import pytest, sys
          sys.exit(pytest.main(['perception/tests', 'tests/governance', '-q']))
          "

      - name: Claims-integrity check -- no unproven-capability language in perception docs
        run: |
          python3 -c "
          import re, sys
          from pathlib import Path

          FLAG = re.compile(r'real OCR|production OCR|general[- ]purpose OCR|general screenshot ingestion', re.I)
          # A flagged phrase is fine if a disclaiming word appears anywhere in
          # the same paragraph (a blank-line-delimited block of a .py
          # docstring or .md file) -- this tolerates the phrase being split
          # across wrapped lines, unlike a pure per-line grep -v.
          DISCLAIM = re.compile(
              r'not a text-recognition|NotImplementedError|unwired|does NOT|no text-recognition|'
              r'misread as a claim|extension point|not wired|no live OCR',
              re.I,
          )

          bad = []
          for path in list(Path('perception').rglob('*.py')) + list(Path('perception').rglob('*.md')):
              text = path.read_text()
              for para in re.split(r'\n\s*\n', text):
                  if FLAG.search(para) and not DISCLAIM.search(para):
                      bad.append((path, para.strip().splitlines()[0][:100]))

          if bad:
              print('Unproven-capability claim language found in perception/ -- failing the build.')
              for path, line in bad:
                  print(f'  {path}: {line}')
              sys.exit(1)
          print('No unproven-capability claim language found.')
          "

      - name: Verify no real secrets committed under perception/
        run: |
          if grep -rEn "(API_KEY|ACCESS_TOKEN|SECRET|PASSWORD)[\"']?\s*[:=]\s*[\"'][A-Za-z0-9_\-]{20,}" perception/ --include="*.py" --include="*.json" --include="*.md" | grep -v "fixture\|not-real\|os.environ"; then
            echo "Possible hardcoded secret found -- failing the build."
            exit 1
          fi
          echo "No hardcoded secret patterns found."
